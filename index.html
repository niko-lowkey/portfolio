<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it every env(safe-area-inset-*) the phone
         shell pads with is 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO. When you buy angeloalob.com, change the three URLs below (canonical, og:url, og:image). -->
    <title>Angelo Alob | GoHighLevel and Automation Specialist</title>
    <meta name="description" content="I build GoHighLevel funnels, CRM pipelines and automations that follow up with leads and book appointments for small and medium businesses." />
    <meta name="author" content="Angelo Alob" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- The browser bar takes the page colour (--cream per theme); the inline
         theme script below and lib/theme.ts keep it in step with the toggle.
         Literal hex here only because this runs before any stylesheet loads. -->
    <meta name="theme-color" content="#FBFDFE" />
    <link rel="canonical" href="https://angeloalobportfolio.vercel.app/" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- The rail avatar is above the fold on every desktop route. Keep this in
         sync with profile.avatarSrc in src/data/profile.ts. -->
    <link rel="preload" as="image" href="/avatar.png" fetchpriority="high" media="(min-width: 1100px)" />

    <!-- Open Graph / social share. og:image must be an absolute URL.
         The image file lives at public/share.png (1200 x 627). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Angelo Alob Portfolio" />
    <meta property="og:title" content="Angelo Alob | GoHighLevel and Automation Specialist" />
    <meta property="og:description" content="I build GoHighLevel funnels, CRM pipelines and automations that follow up with leads and book appointments for small and medium businesses." />
    <meta property="og:url" content="https://angeloalobportfolio.vercel.app/" />
    <meta property="og:image" content="https://angeloalobportfolio.vercel.app/share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:image:alt" content="Angelo Alob portfolio homepage: Automate the busywork. Grow the business." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Angelo Alob | GoHighLevel and Automation Specialist" />
    <meta name="twitter:description" content="I build GoHighLevel funnels, CRM pipelines and automations that follow up with leads and book appointments for small and medium businesses." />
    <meta name="twitter:image" content="https://angeloalobportfolio.vercel.app/share.png" />

    <!-- Theme before first paint: no flash of the wrong palette. Default is
         light; dark is the visitor's opt-in, persisted in localStorage. -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
        if (document.documentElement.dataset.theme === 'dark') {
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) bar.setAttribute('content', '#1B2B38');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
